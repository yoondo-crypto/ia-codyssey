<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 영화 티어리스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(180, 0, 0, 0.25), transparent 35%),
        linear-gradient(180deg, #090909 0%, #151515 100%);
      color: #f5f5f5;
      min-height: 100vh;
    }

    .container {
      width: 1100px;
      max-width: calc(100% - 48px);
      margin: 0 auto;
      padding: 40px 0 60px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 10px;
      color: #bdbdbd;
      font-size: 16px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      margin-bottom: 24px;
    }

    .hashtag-area label {
      display: block;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 18px;
    }

    #hashtagInput {
      width: 100%;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      outline: none;
      background: rgba(0, 0, 0, 0.35);
      color: #ffffff;
      font-size: 16px;
    }

    #hashtagInput::placeholder {
      color: #8e8e8e;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #111;
      background: #ffffff;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 14px;
    }

    .tier-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tier-row {
      display: grid;
      grid-template-columns: 90px 1fr;
      min-height: 92px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
    }

    .tier-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      color: #111;
    }

    .tier-label.s { background: #ff3b30; }
    .tier-label.a { background: #ff6b2c; }
    .tier-label.b { background: #ff9f0a; }
    .tier-label.c { background: #ffd60a; }
    .tier-label.d { background: #fff3a3; }
    .tier-label.f { background: #ffffff; }

    .drop-zone {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px;
      min-height: 92px;
      transition: background 0.15s ease;
    }

    .drop-zone.drag-over {
      background: rgba(255, 255, 255, 0.12);
    }

    .unclassified {
      min-height: 120px;
      border-radius: 22px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }

    .movie-card {
      padding: 14px 18px;
      border-radius: 20px;
      background: linear-gradient(145deg, #2f2f2f, #1c1c1c);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-weight: 700;
      cursor: grab;
      user-select: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 10px 24px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .movie-card:hover {
      transform: translateY(-2px);
    }

    .movie-card:active {
      cursor: grabbing;
    }

    .movie-card.dragging {
      opacity: 0.45;
    }

    .empty-text {
      color: #8f8f8f;
      font-size: 14px;
    }

    footer {
      margin-top: 24px;
      color: #8f8f8f;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>나만의 영화 티어리스트</h1>
      <p class="subtitle">영화를 드래그해서 원하는 등급에 배치해 보세요.</p>
    </header>

    <section class="panel hashtag-area">
      <label for="hashtagInput">적용 기준</label>
      <input
        id="hashtagInput"
        type="text"
        placeholder="예: #서사 #연출 #메시지"
      />
    </section>

    <div class="top-actions">
      <button id="resetButton" type="button">영화 배치 초기화</button>
    </div>

    <section class="panel">
      <h2 class="section-title">미분류</h2>
      <div id="unclassified" class="unclassified drop-zone" data-zone="unclassified"></div>
    </section>

    <section class="tier-list">
      <div class="tier-row">
        <div class="tier-label s">S</div>
        <div class="drop-zone" data-zone="S"></div>
      </div>

      <div class="tier-row">
        <div class="tier-label a">A</div>
        <div class="drop-zone" data-zone="A"></div>
      </div>

      <div class="tier-row">
        <div class="tier-label b">B</div>
        <div class="drop-zone" data-zone="B"></div>
      </div>

      <div class="tier-row">
        <div class="tier-label c">C</div>
        <div class="drop-zone" data-zone="C"></div>
      </div>

      <div class="tier-row">
        <div class="tier-label d">D</div>
        <div class="drop-zone" data-zone="D"></div>
      </div>

      <div class="tier-row">
        <div class="tier-label f">F</div>
        <div class="drop-zone" data-zone="F"></div>
      </div>
    </section>

    <footer>
      배치와 적용 기준은 이 브라우저에 자동 저장됩니다.
    </footer>
  </div>

  <script>
    const movies = [
      { id: "parasite", title: "기생충" },
      { id: "interstellar", title: "인터스텔라" },
      { id: "lalaland", title: "라라랜드" },
      { id: "spirited-away", title: "센과 치히로의 행방불명" },
      { id: "avengers-endgame", title: "어벤져스: 엔드게임" },
      { id: "the-roundup", title: "범죄도시" },
      { id: "titanic", title: "타이타닉" },
      { id: "toy-story", title: "토이 스토리" }
    ];

    const zones = ["unclassified", "S", "A", "B", "C", "D", "F"];

    const STORAGE_KEY = "movieTierListLayout";
    const HASHTAG_KEY = "movieTierListHashtags";

    let layout = loadLayout();

    const hashtagInput = document.getElementById("hashtagInput");
    const resetButton = document.getElementById("resetButton");

    function createDefaultLayout() {
      return {
        unclassified: movies.map(movie => movie.id),
        S: [],
        A: [],
        B: [],
        C: [],
        D: [],
        F: []
      };
    }

    function loadLayout() {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        return createDefaultLayout();
      }

      try {
        const parsed = JSON.parse(saved);
        const validMovieIds = movies.map(movie => movie.id);
        const newLayout = {
          unclassified: [],
          S: [],
          A: [],
          B: [],
          C: [],
          D: [],
          F: []
        };

        zones.forEach(zone => {
          if (Array.isArray(parsed[zone])) {
            newLayout[zone] = parsed[zone].filter(id => validMovieIds.includes(id));
          }
        });

        const placedIds = zones.flatMap(zone => newLayout[zone]);
        validMovieIds.forEach(id => {
          if (!placedIds.includes(id)) {
            newLayout.unclassified.push(id);
          }
        });

        return newLayout;
      } catch {
        return createDefaultLayout();
      }
    }

    function saveLayout() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(layout));
    }

    function getMovieTitle(id) {
      const movie = movies.find(movie => movie.id === id);
      return movie ? movie.title : "";
    }

    function render() {
      zones.forEach(zone => {
        const zoneElement = document.querySelector(`[data-zone="${zone}"]`);
        zoneElement.innerHTML = "";

        if (layout[zone].length === 0) {
          const emptyText = document.createElement("span");
          emptyText.className = "empty-text";
          emptyText.textContent = zone === "unclassified"
            ? "미분류 영화가 없습니다."
            : "이 등급에 영화를 놓으세요.";
          zoneElement.appendChild(emptyText);
        }

        layout[zone].forEach(movieId => {
          const card = document.createElement("div");
          card.className = "movie-card";
          card.draggable = true;
          card.dataset.movieId = movieId;
          card.textContent = getMovieTitle(movieId);

          card.addEventListener("dragstart", handleDragStart);
          card.addEventListener("dragend", handleDragEnd);

          zoneElement.appendChild(card);
        });
      });
    }

    function handleDragStart(event) {
      event.dataTransfer.setData("text/plain", event.target.dataset.movieId);
      event.target.classList.add("dragging");
    }

    function handleDragEnd(event) {
      event.target.classList.remove("dragging");
    }

    function moveMovie(movieId, targetZone) {
      zones.forEach(zone => {
        layout[zone] = layout[zone].filter(id => id !== movieId);
      });

      layout[targetZone].push(movieId);
      saveLayout();
      render();
    }

    document.querySelectorAll(".drop-zone").forEach(zoneElement => {
      zoneElement.addEventListener("dragover", event => {
        event.preventDefault();
        zoneElement.classList.add("drag-over");
      });

      zoneElement.addEventListener("dragleave", () => {
        zoneElement.classList.remove("drag-over");
      });

      zoneElement.addEventListener("drop", event => {
        event.preventDefault();
        zoneElement.classList.remove("drag-over");

        const movieId = event.dataTransfer.getData("text/plain");
        const targetZone = zoneElement.dataset.zone;

        if (movieId && targetZone) {
          moveMovie(movieId, targetZone);
        }
      });
    });

    hashtagInput.value = localStorage.getItem(HASHTAG_KEY) || "";

    hashtagInput.addEventListener("input", () => {
      localStorage.setItem(HASHTAG_KEY, hashtagInput.value);
    });

    resetButton.addEventListener("click", () => {
      layout = createDefaultLayout();
      saveLayout();
      render();
    });

    render();
  </script>
</body>
</html>
